name: Release

# Release Please opens/updates a release PR from Conventional Commits. Merging
# that PR creates the vX.Y.Z tag and GitHub Release; the jobs below then attach
# artifacts and update the Homebrew tap. They run in this workflow (not on
# "push: tags") because tags created with GITHUB_TOKEN do not trigger other
# workflows.

on:
  push:
    branches: [main]
  # Re-run the artifact build for an existing tag (e.g. after a failed run).
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish (e.g. v1.1.0)
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Decides which tag, if any, the jobs below build: the dispatched tag, or the
  # tag Release Please just created.
  plan:
    needs: release-please
    if: always()
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_CREATED: ${{ needs.release-please.outputs.release_created }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          tag=""
          if [ "$EVENT" = workflow_dispatch ]; then
            tag="$INPUT_TAG"
          elif [ "$RELEASE_CREATED" = true ]; then
            tag="$RELEASE_TAG"
          fi
          if [ -n "$tag" ] && ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::unexpected tag: $tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.os }}/${{ matrix.arch }})
    needs: plan
    if: needs.plan.outputs.tag != ''
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: amd64, runner: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: linux, arch: arm64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: darwin, arch: amd64, runner: macos-latest, target: x86_64-apple-darwin }
          - { os: darwin, arch: arm64, runner: macos-latest, target: aarch64-apple-darwin }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.tag }}
          persist-credentials: false
      - name: Install toolchain
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
      # cargo-auditable embeds the dependency list in the binary so that syft
      # can report the crates in each archive's SBOM.
      - name: Install cargo-auditable
        run: cargo install cargo-auditable --version 0.7.7 --locked
      - name: Build
        run: |
          # Equivalent of Go's -trimpath: no build machine paths in the binary.
          export RUSTFLAGS="--remap-path-prefix=$PWD=/build --remap-path-prefix=$HOME/.cargo=/cargo --remap-path-prefix=$HOME/.rustup=/rustup"
          cargo auditable build --locked --release --target ${{ matrix.target }}
      # The Intel macOS binary is cross-built on an Apple Silicon runner.
      - name: Smoke test
        if: matrix.target != 'x86_64-apple-darwin'
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          out=$(target/${{ matrix.target }}/release/buu --version)
          test "$out" = "buu ${TAG#v}" || { echo "::error::unexpected version output: $out"; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: buu-${{ matrix.os }}-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/buu
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write      # upload release assets
      id-token: write      # keyless signing and attestations
      attestations: write
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: buu-*
          path: bin
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - name: Package archives, SBOMs and checksums
        run: scripts/package.sh "$TAG" bin dist
      - name: Sign checksums
        run: cosign sign-blob --yes --bundle dist/checksums.txt.sigstore.json dist/checksums.txt
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/checksums.txt
      - name: Upload release assets
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  # Points the tap formula at the new release. Release Please owns the release
  # notes; this only rewrites Formula/buu.rb in the tap.
  homebrew:
    needs: [plan, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAP: ${{ github.repository_owner }}/homebrew-tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.tag }}
          persist-credentials: false
      - name: Update tap formula
        env:
          # Deploy key with write access to the tap repository only.
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          gh release download "$TAG" --pattern checksums.txt --repo "$GITHUB_REPOSITORY"

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$TAP_DEPLOY_KEY" > "$HOME/.ssh/tap_deploy_key"
          chmod 600 "$HOME/.ssh/tap_deploy_key"
          gh api meta --jq '.ssh_keys[] | "github.com " + .' > "$HOME/.ssh/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/tap_deploy_key -o IdentitiesOnly=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=yes"

          git clone --depth 1 "git@github.com:$TAP.git" tap
          scripts/formula.sh "$TAG" checksums.txt > tap/Formula/buu.rb
          cd tap
          if git diff --quiet; then
            echo "Formula already up to date."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -am "buu ${TAG#v}"
          git push origin HEAD:main
